name: Update all 40443

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # این خط مهم است
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.mGITHUB_TOKEN }}  # اضافه کردن این خط
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Run filter script
      run: |
        python all_40443.py
    
    - name: Commit and push
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git diff --staged --quiet || (git commit -m "all_40443 (port 443) - $(date +'%Y-%m-%d %H:%M:%S')" && git push)
