name: Update Optimized Proxy List

on:
  schedule:
    - cron: '*/360 * * * *'
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create script directory
        run: mkdir -p scripts

      - name: Create Python script
        run: |
          echo 'import re' > scripts/optimize-proxies.py
          echo 'import urllib.request' >> scripts/optimize-proxies.py
          echo 'from urllib.parse import quote' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo 'SOURCE_URL = "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks5/data.txt"' >> scripts/optimize-proxies.py
          echo 'OUTPUT_FILE = "optimized-proxies.txt"' >> scripts/optimize-proxies.py
          echo 'TARGET_FORMAT = "socks://Og==@{host}:{port}#{host}%3A{port}"' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo 'def fetch_proxies():' >> scripts/optimize-proxies.py
          echo '    with urllib.request.urlopen(SOURCE_URL, timeout=30) as response:' >> scripts/optimize-proxies.py
          echo '        return response.read().decode("utf-8").splitlines()' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo 'def parse_socks5_line(line):' >> scripts/optimize-proxies.py
          echo '    match = re.match(r"socks5://([^:]+):(\d+)", line.strip())' >> scripts/optimize-proxies.py
          echo '    if match:' >> scripts/optimize-proxies.py
          echo '        return match.groups()' >> scripts/optimize-proxies.py
          echo '    return None' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo 'def convert_to_target(host, port):' >> scripts/optimize-proxies.py
          echo '    return TARGET_FORMAT.format(host=host, port=port)' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo 'def main():' >> scripts/optimize-proxies.py
          echo '    print("Fetching proxies from source...")' >> scripts/optimize-proxies.py
          echo '    raw_lines = fetch_proxies()' >> scripts/optimize-proxies.py
          echo '    proxies_set = set()' >> scripts/optimize-proxies.py
          echo '    converted_lines = []' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo '    for line in raw_lines:' >> scripts/optimize-proxies.py
          echo '        parsed = parse_socks5_line(line)' >> scripts/optimize-proxies.py
          echo '        if not parsed:' >> scripts/optimize-proxies.py
          echo '            continue' >> scripts/optimize-proxies.py
          echo '        host, port = parsed' >> scripts/optimize-proxies.py
          echo '        if (host, port) in proxies_set:' >> scripts/optimize-proxies.py
          echo '            continue' >> scripts/optimize-proxies.py
          echo '        proxies_set.add((host, port))' >> scripts/optimize-proxies.py
          echo '        converted_lines.append(convert_to_target(host, port))' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo '    with open(OUTPUT_FILE, "w", encoding="utf-8") as f:' >> scripts/optimize-proxies.py
          echo '        f.write("\n".join(converted_lines))' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo '    print(f"✅ {len(converted_lines)} proxies optimized and saved to {OUTPUT_FILE}")' >> scripts/optimize-proxies.py
          echo '' >> scripts/optimize-proxies.py
          echo 'if __name__ == "__main__":' >> scripts/optimize-proxies.py
          echo '    main()' >> scripts/optimize-proxies.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run optimization script
        run: python scripts/optimize-proxies.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add optimized-proxies.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update optimized proxy list"
          git push
