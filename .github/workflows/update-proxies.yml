name: Update Optimized Proxy List

on:
  schedule:
    - cron: '*/360 * * * *'
  workflow_dispatch:

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create scripts directory and Python script
        run: |
          mkdir -p scripts
          cat > scripts/optimize-proxies.py << 'EOF'
import re
import requests
from urllib.parse import quote

SOURCE_URL = "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks5/data.txt"
OUTPUT_FILE = "optimized-proxies.txt"
TARGET_FORMAT = "socks://Og==@{host}:{port}#{host}%3A{port}"

def fetch_proxies():
    response = requests.get(SOURCE_URL, timeout=30)
    response.raise_for_status()
    return response.text.splitlines()

def parse_socks5_line(line):
    match = re.match(r'socks5://([^:]+):(\d+)', line.strip())
    if match:
        return match.groups()
    return None

def convert_to_target(host, port):
    return TARGET_FORMAT.format(host=host, port=port)

def main():
    print("📡 Fetching proxies from source...")
    raw_lines = fetch_proxies()
    proxies_set = set()
    converted_lines = []

    for line in raw_lines:
        parsed = parse_socks5_line(line)
        if not parsed:
            continue
        host, port = parsed
        if (host, port) in proxies_set:
            continue
        proxies_set.add((host, port))
        converted_lines.append(convert_to_target(host, port))

    with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
        f.write("\n".join(converted_lines))

    print(f"✅ {len(converted_lines)} proxies optimized and saved to {OUTPUT_FILE}")

if __name__ == "__main__":
    main()
EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run optimization script
        run: python scripts/optimize-proxies.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add optimized-proxies.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update optimized proxy list"
          git push
